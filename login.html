<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Incident Management</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}.card{width:min(420px,92vw);background:white;padding:32px;border-radius:16px;box-shadow:0 12px 40px #0f172a18}h1{margin:0 0 8px;color:#172554}p{color:#64748b;margin:0 0 24px}label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}button{width:100%;padding:12px;margin-top:22px;background:#1d4ed8;color:white;border:0;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}#error{color:#b91c1c;min-height:20px;margin-top:12px;font-size:14px}.hint{background:#f8fafc;border-radius:8px;padding:12px;font-size:12px;line-height:1.6;color:#475569;margin-top:18px}</style></head>
<body><main class="card"><h1>Incident Management</h1><p>Sign in to continue to your workspace.</p><form id="loginForm"><label for="username">Username</label><input id="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><div id="error" role="alert"></div></form><div class="hint"><b>Demo accounts</b><br>Admin: admin / Admin@123<br>Employee: employee / Employee@123<br>Technician: technician / Tech@123<br><br>Change these passwords before using the app beyond local testing.</div></main>
<script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');location.href='/';}catch(err){error.textContent=err.message;}});</script></body></html>
